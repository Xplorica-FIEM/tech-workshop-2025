        <!--
            NOTE for WCs (lines 41-76 in this file):

            The navbar below is the default responsive Bootstrap navbar component
            copied from the Bootstrap docs as an example. It's left here so you can
            see how a typical Bootstrap navbar is structured and how it behaves on
            different screen sizes.

            Key parts explained:
            - <nav class="navbar navbar-expand-lg ...">: the root element. The
                'navbar-expand-lg' class makes the menu expanded on large screens and
                collapsed (toggled) on smaller screens.
            - .container-fluid: keeps the navbar full-width and aligns its contents.
            - .navbar-brand: the logo or brand text link.
            - .navbar-toggler (with data-bs-toggle/data-bs-target): the hamburger
                button that appears on small screens to toggle the collapsed menu.
            - .collapse.navbar-collapse with an id (e.g. #navbarSupportedContent):
                the collapsible wrapper that contains navigation links and other
                controls. The toggler button targets this element.
            - .navbar-nav and .nav-item/.nav-link: the list of navigation links.

            How to use/modify:
            - Change breakpoints by using navbar-expand-sm/md/lg/xl.
            - Add or remove links inside the <ul class="navbar-nav">.
            - For dropdowns, use the .dropdown classes (example included below).

            Reference: https://getbootstrap.com/docs/5.3/components/navbar/
        -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
                </li>
                <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Dropdown
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Action</a></li>
                    <li><a class="dropdown-item" href="#">Another action</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
                </li>
                <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                </li>
            </ul>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            </div>
        </div>
    </nav>

    </div>
