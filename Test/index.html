<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Demo</title>

    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }
        table tr th,
        table tr td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        table tr th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Table Demo</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Country</th>
        </tr>

        <tr>
            <td>Data 1</td>
            <td>Data 2</td>
            <td>Data 3</td>
        </tr>

        <tr>
            <td>Data 4</td>
            <td>Data 5</td>
            <td>Data 6</td>
        </tr>
    </table>

</body>
</html>
